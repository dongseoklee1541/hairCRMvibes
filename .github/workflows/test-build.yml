name: Test and Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-synthetic-only
          POSTGRES_DB: haircrm_r10_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      R10_DISPOSABLE_DATABASE_URL: postgresql://postgres:ci-synthetic-only@127.0.0.1:5432/haircrm_r10_test
      R10_CONFIRM_DISPOSABLE: 'YES'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify R-10 database contracts (disposable PostgreSQL)
        run: |
          psql "$R10_DISPOSABLE_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tests/sql/rls-auto-enable-hardening.sql
          psql "$R10_DISPOSABLE_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/r16_disposable_bootstrap.sql
          psql "$R10_DISPOSABLE_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f schema.sql
          psql "$R10_DISPOSABLE_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/r10_role_management.sql
          bash supabase/tests/r10_role_management_concurrency.sh

      - name: Build application
        run: npm run build
